name: Dazai Player Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "Warning: gradlew wrapper not found. Creating a temporary one via system gradle..."
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Clean and Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace --build-cache --parallel --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dazai-Player-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
