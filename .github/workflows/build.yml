name: Build Dazai Player

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    env:
      # إخفاء تحذيرات Node.js 20 وتفعيل النسخة الأحدث في جيت هاب
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          # التخزين المؤقت لملفات Gradle لتسريع العمليات القادمة
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        # بما أن gradlew مفقود، سنستخدم gradle المثبت في النظام مباشرة
        run: gradle assembleDebug --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dazai-Player-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
